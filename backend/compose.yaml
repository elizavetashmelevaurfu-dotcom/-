services:
  db:
    image: postgres:16
    container_name: app-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app-spring-boot
    ports:
      - "8080:8080"
    environment:
      # Переопределяем URL базы данных, чтобы приложение подключалось к контейнеру 'db'
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy # Ждем, пока база данных будет готова
    # Опционально: монтируем volume для логов или других файлов
    # volumes:
    #   - ./logs:/app/logs

volumes:
  pgdata: